*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:28px;background:#f5ecd9;color:#40362f;font-family:Arial,sans-serif}.card{width:min(100%,420px);background:#fffaf0;padding:38px;border:1px solid #e3d5ba;box-shadow:0 12px 40px #74604415}.stamp{font-family:Georgia,serif;color:#ad4b32;font-size:30px;margin:0 0 26px}.eyebrow{font-size:10px;letter-spacing:2px;color:#8a755c}h1{font:normal 52px/1.05 Georgia,serif;letter-spacing:-2px;margin:18px 0}h1 em{color:#ad4b32;font-weight:normal}p{font-size:14px;color:#756550;line-height:1.6;margin:20px 0 28px}label{display:block;font-size:12px;margin:0 0 8px}input{font:16px Arial,sans-serif;width:100%;padding:14px;border:1px solid #caba9e;border-radius:3px;background:#fffdf7;color:#40362f}input:focus{outline:2px solid #ad4b32;outline-offset:2px}button{font:14px Arial,sans-serif;background:#ad4b32;color:white;border:0;padding:15px 20px;width:100%;margin-top:14px;border-radius:3px;cursor:pointer}button:disabled{opacity:.65;cursor:wait}.error{color:#953719;font-size:13px;line-height:1.5;margin-top:14px;min-height:20px}.note{font-size:11px;margin:22px 0 0}noscript{display:block;margin-top:20px;font-size:13px}@media(max-width:450px){.card{padding:28px}h1{font-size:46px}}
</style></head><body><main class="card"><div class="stamp" aria-hidden="true">日</div><div class="eyebrow">OUR FAMILY TRAVEL JOURNAL</div><h1>We’re going<br>to <em>Japan!</em></h1><p>The family adventure starts here.<br>Enter our password and have a little daydream.</p><form id="unlock"><label for="password">Family password</label><input id="password" type="password" autocomplete="current-password" required autocapitalize="none" spellcheck="false"><button id="submit" type="submit">Let’s go ↗</button><div class="error" id="status" role="status" aria-live="polite"></div></form><p class="note">Use the password shared with the family.</p><noscript>Enable JavaScript to unlock the encrypted itinerary.</noscript></main><script src="unlock.js"></script></body></html>
